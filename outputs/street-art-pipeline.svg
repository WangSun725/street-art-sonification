<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Street Art Sonification Pipeline</title>
  <desc id="desc">Artwork image and artist statement pass through Qwen3-VL 2B Instruct 4-bit and SAM 2.1 Hiera Tiny. Region masks and pointer interaction produce web audio and an interaction signal.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#A5A29B"/>
    </marker>
  </defs>

  <rect width="1200" height="260" fill="#F7F6F2"/>

  <g fill="none" stroke="#A5A29B" stroke-width="2" marker-end="url(#arrow)">
    <path d="M226 130 H262"/>
    <path d="M452 130 H488"/>
    <path d="M678 130 H714"/>
    <path d="M914 130 H950"/>
  </g>

  <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
    <g>
      <rect x="26" y="67" width="200" height="126" rx="10" fill="#FFFFFF" stroke="#D7D4CD"/>
      <text x="126" y="94" text-anchor="middle" font-size="11" letter-spacing="1.7" fill="#8D8981">INPUT</text>
      <text x="126" y="127" text-anchor="middle" font-size="16" font-weight="500" fill="#22211F">ARTWORK IMAGE</text>
      <text x="126" y="153" text-anchor="middle" font-size="12" fill="#77736C">+</text>
      <text x="126" y="176" text-anchor="middle" font-size="15" font-weight="500" fill="#22211F">ARTIST STATEMENT</text>
    </g>

    <g>
      <rect x="272" y="67" width="180" height="126" rx="10" fill="#E8E5DE"/>
      <text x="362" y="94" text-anchor="middle" font-size="11" letter-spacing="1.7" fill="#77736C">MODEL</text>
      <text x="362" y="133" text-anchor="middle" font-size="17" font-weight="500" fill="#22211F">QWEN3-VL 2B</text>
      <text x="362" y="160" text-anchor="middle" font-size="12" letter-spacing="0.7" fill="#66625C">INSTRUCT 4-BIT</text>
    </g>

    <g>
      <rect x="498" y="67" width="180" height="126" rx="10" fill="#E8E5DE"/>
      <text x="588" y="94" text-anchor="middle" font-size="11" letter-spacing="1.7" fill="#77736C">MODEL</text>
      <text x="588" y="133" text-anchor="middle" font-size="17" font-weight="500" fill="#22211F">SAM 2.1</text>
      <text x="588" y="160" text-anchor="middle" font-size="12" letter-spacing="0.7" fill="#66625C">HIERA TINY</text>
    </g>

    <g>
      <rect x="724" y="67" width="190" height="126" rx="10" fill="#FFFFFF" stroke="#D7D4CD"/>
      <text x="819" y="94" text-anchor="middle" font-size="11" letter-spacing="1.7" fill="#8D8981">INTERACTION</text>
      <text x="819" y="130" text-anchor="middle" font-size="16" font-weight="500" fill="#22211F">REGION MASKS</text>
      <text x="819" y="154" text-anchor="middle" font-size="12" fill="#77736C">+</text>
      <text x="819" y="177" text-anchor="middle" font-size="15" font-weight="500" fill="#22211F">POINTER</text>
    </g>

    <g>
      <rect x="960" y="67" width="214" height="126" rx="10" fill="#22211F"/>
      <text x="1067" y="94" text-anchor="middle" font-size="11" letter-spacing="1.7" fill="#C9C5BC">OUTPUT</text>
      <text x="1067" y="132" text-anchor="middle" font-size="16" font-weight="500" fill="#FFFFFF">WEB AUDIO</text>
      <text x="1067" y="160" text-anchor="middle" font-size="15" font-weight="500" fill="#FFFFFF">INTERACTION SIGNAL</text>
    </g>
  </g>
</svg>
